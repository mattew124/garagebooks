# TeslaMate has no stable database schema, so a new TeslaMate release can break this app
# without any change here. Every day, look for a TeslaMate release newer than the one recorded in
# garagebooks/compat.py (nothing runs when there is none), run the suite against its real schema and:
#   - fails: open (or update) one issue;
#   - passes: record it (compat.py, README, CHANGELOG) in a pull request, run CI on it, merge it and tag
#     the next release candidate, which the Release workflow builds. scripts/auto_rc.py decides the tag,
#     and only when it is unambiguous (see there); otherwise the pull request is left for the owner.
# A stable release is never tagged here: the owner tests the candidate and tags it.
# Needs Settings > Actions > "Allow GitHub Actions to create pull requests". Pushes and pull requests made
# with the workflow token don't start other workflows, so CI and the release are started by dispatch.
name: TeslaMate compatibility
on:
  schedule:
    - cron: "43 19 * * *"   # daily, early morning in Australia (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency: teslamate-compat

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true   # the release step pushes a branch and a tag
          fetch-depth: 0              # the tags decide the next candidate
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - name: Test against the latest TeslaMate
        id: compat
        run: |
          set +e
          scripts/teslamate-compat.sh latest --if-new 2>&1 | tee compat.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Record the release, merge it and tag a candidate
        if: steps.compat.outputs.status == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          scripts/teslamate-compat.sh latest --record
          version="$(.venv/bin/python -c 'from garagebooks import compat; print(compat.TESTED_TESLAMATE)')"
          branch="compat/teslamate-$version"
          tag="$(.venv/bin/python scripts/auto_rc.py prepare)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Record TeslaMate $version as tested"
          git push --force-with-lease origin "$branch"
          if [ -n "$tag" ]; then
              next="Once CI passes this is merged and $tag is tagged, which builds the candidate."
          else
              next="The next release number isn't clear from the tags and the CHANGELOG, so merge it and tag a candidate yourself."
          fi
          cat > "$RUNNER_TEMP/pr-body.md" <<BODY
          The test suite passed against TeslaMate $version's own schema in $RUN_URL. This records it in
          \`garagebooks/compat.py\`, the README and the CHANGELOG. $next
          BODY
          gh pr create --base main --head "$branch" --title "Record TeslaMate $version as tested" \
              --body-file "$RUNNER_TEMP/pr-body.md" || gh pr view "$branch" --json url --jq .url
          [ -n "$tag" ] || exit 0
          # CI on the branch: a dispatched run starts even though the push was made with the workflow token.
          gh workflow run ci.yml --ref "$branch"
          sleep 30
          run="$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run watch "$run" --exit-status
          gh pr merge "$branch" --squash --delete-branch
          sha="$(gh pr view "$branch" --json mergeCommit --jq .mergeCommit.oid)"
          git tag -a "$tag" -m "$tag" "$sha"
          git push origin "$tag"
          gh workflow run release.yml --ref "$tag"
      - name: Open or update the issue
        if: failure() || (steps.compat.outputs.status != '0' && steps.compat.outputs.status != '2')
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.compat.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Latest TeslaMate release needs attention"
          what="The check on the latest TeslaMate release failed: the tests did, a table we read changed, or recording and releasing it did not finish. Reproduce with \`scripts/teslamate-compat.sh latest\`."
          body="$what

          Run: $RUN_URL

          \`\`\`
          $(tail -n 40 compat.log)
          \`\`\`"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
          else
              gh issue create --title "$title" --body "$body"
          fi
          exit 1
